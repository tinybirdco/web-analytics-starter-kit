name: CI

on: [push]

jobs:
  dashboard:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install
      - name: Lint
        run: pnpm run lint
      - name: Build
        run: pnpm run build
        env:
          CI: true
      - name: Test dashboard credential isolation
        env:
          TINYBIRD_TOKEN: server-token-must-never-leave
          TINYBIRD_HOST: http://127.0.0.1:1
          DISABLE_AUTH: 'true'
        run: |
          node dashboard/tests/credentials.cjs
          pnpm --filter @tinybirdco/analytics-dashboard exec next start -p 3097 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://localhost:3097/ > /dev/null; then break; fi
            sleep 1
          done
          node dashboard/tests/token-auth.mjs

  middleware:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install
      - name: Lint
        run: pnpm --filter @tinybirdco/flock.js run lint --if-present
      - name: Build
        run: pnpm --filter @tinybirdco/flock.js run build
        env:
          CI: true
